name: Web checks
on:
  pull_request:
    branches: [main]
    paths: ['web/**', 'deploy/web/**', 'tools/web-sync-fixture.swift', '.github/workflows/web.yml']
  push:
    branches: [main]
    paths: ['web/**', 'deploy/web/**', 'tools/web-sync-fixture.swift', '.github/workflows/web.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Server tests and build
        working-directory: web
        run: |
          go test ./...
          go build -o /tmp/yoteikan-web .
      - name: Wire format and sync tests
        run: |
          node --check web/static/app.mjs
          node --test web/test/*.test.mjs
      - name: Deployment configuration
        env:
          GOOGLE_WEB_CLIENT_ID: 123-test.apps.googleusercontent.com
        run: docker compose -f deploy/web/compose.yaml config --quiet
